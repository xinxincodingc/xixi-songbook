<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>xixi · 歌单管理</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="admin.css"><script defer src="songs.js"></script><script defer src="queue-config.js"></script><script defer src="admin.js"></script></head>
<body>
<header class="header"><a class="wordmark" href="index.html">xixi<span class="brand-dot">●</span></a><a href="index.html">返回点歌平台 ↗</a></header>
<main class="admin-main">
  <div class="eyebrow">XIXI / YOUR SONGBOOK</div><h1>歌单管理</h1><p class="admin-intro">新增、修改或下架歌曲，保存后访客即可看到更新。</p>
  <div id="admin-status" role="status"></div>
  <section id="login-panel"><form id="login-form"><label>管理员密码<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label><button class="primary full" id="login-button">登录 <span>↗</span></button></form></section>
  <section id="editor-panel" hidden>
    <div class="admin-actions"><button class="primary" id="add-song">新增歌曲 ＋</button><button class="secondary" id="logout">退出登录</button></div>
    <label class="admin-search">搜索歌曲<input type="search" id="admin-search" placeholder="歌名或原唱"></label><p id="catalog-count"></p>
    <div id="admin-songs"></div>
    <details class="password-settings"><summary>修改管理员密码</summary><form id="password-form"><label>新密码<input type="password" name="newPassword" required minlength="12" maxlength="200" autocomplete="new-password"></label><label>再次输入<input type="password" name="confirmation" required minlength="12" maxlength="200" autocomplete="new-password"></label><button class="secondary full">更新密码</button></form></details>
  </section>
</main>
<dialog id="song-dialog"><button id="close-song" class="dialog-close" aria-label="关闭">×</button><h2 id="edit-title">新增歌曲</h2><form id="song-form"><label>歌名<input name="title" required maxlength="120"></label><label>原唱歌手<input name="artist" required maxlength="120" placeholder="例如：xixi"></label><label>曲风<select name="style"><option>流行</option><option>R&B</option><option>欧美</option><option>原创</option></select></label><label class="enabled-field"><input name="enabled" type="checkbox" checked> 在点歌平台显示</label><p class="admin-intro">取消显示即下架，已提交的点歌记录仍保留。</p><p id="edit-status" role="status"></p><button class="primary full" id="save-song">保存歌曲 <span>↗</span></button></form></dialog>
</body></html>
